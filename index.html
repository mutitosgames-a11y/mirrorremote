<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Mirror Control</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#050505;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.095);--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.55);--success:#75e6a0;--danger:#ff7884;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:#fff} body{padding:12px 10px calc(20px + var(--safe));overflow-x:hidden}
.app{width:min(760px,100%);margin:auto}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px)}
.status-row{display:flex;justify-content:flex-end;align-items:center;padding:2px 4px 9px}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.65rem}.status i{font-size:.4rem;color:#777}.status.ok i{color:var(--success)}
.preview-shell{padding:6px;border-radius:27px}.preview-frame{width:100%;aspect-ratio:16/10;min-height:235px;border-radius:21px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
.preview-frame iframe{display:block;width:100%;height:100%;border:0;background:#000}
.message-box{margin-top:9px;padding:11px;border-radius:22px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.message-input{min-width:0;min-height:58px;max-height:150px;resize:none;border:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.16);border-radius:16px;color:#fff;padding:11px 12px;font-size:.88rem;outline:none}.message-input::placeholder{color:rgba(255,255,255,.28)}
.action-col{display:grid;gap:7px}.btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.06);color:#fff;cursor:pointer}.btn.primary{background:#fff;color:#111;border-color:#fff}.btn.danger{color:var(--danger);background:rgba(255,120,132,.08)}.meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding:0 2px;color:var(--muted);font-size:.6rem}.meta-row strong{color:#fff;font-weight:600}.duration-row{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.055)}.duration-label{display:flex;justify-content:space-between;font-size:.64rem;color:var(--muted);margin-bottom:5px}.duration-value{color:#fff;font-weight:600}.range{width:100%;accent-color:#fff;height:22px;cursor:pointer;touch-action:pan-x}.duration-picker{display:grid;grid-template-columns:112px 1fr;gap:8px;align-items:center}.duration-unit{width:100%;height:38px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.1);padding:0 10px;outline:none}
.duration-unit option, select.duration-unit { background-color: #151515 !important; color: #ffffff !important; }
.section-title{margin:16px 3px 8px;font-size:.64rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.quick{border-radius:19px;padding:11px;min-height:78px;text-align:left;color:#fff;cursor:pointer}.quick:active,.setting:active,.choice:active,.btn:active{transform:scale(.985)}.quick-head{display:flex;align-items:center;justify-content:space-between;color:rgba(255,255,255,.78)}.quick-state{font-size:.52rem;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}.quick.active .quick-state{background:rgba(117,230,160,.10);color:var(--success)}.quick b{display:block;margin-top:12px;font-size:.68rem;font-weight:650}.quick small{display:block;margin-top:3px;font-size:.53rem;color:var(--muted); line-height: 1.1;}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.setting{display:block;width:100%;min-height:76px;text-align:left;border-radius:19px;padding:12px;color:#fff;cursor:pointer}.setting-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.06);font-size:.72rem;margin-bottom:9px}.setting b{display:block;font-size:.69rem;font-weight:650}.setting span{display:block;margin-top:3px;font-size:.55rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.46);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.sheet.open{display:flex}.sheet-card{width:min(760px,100%);max-height:82vh;overflow:auto;margin:auto auto 0;border-radius:28px 28px 0 0;background:rgba(16,16,16,.92);border:1px solid var(--line);border-bottom:0;box-shadow:0 -30px 80px rgba(0,0,0,.5);padding:9px 15px calc(18px + var(--safe));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}.handle{width:40px;height:4px;background:rgba(255,255,255,.17);border-radius:99px;margin:3px auto 13px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-head b{font-size:.9rem}.close{width:35px;height:35px;border:0;border-radius:50%;background:rgba(255,255,255,.07);color:#fff}.field{margin:12px 0}.field-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:var(--muted);font-size:.67rem}.field-value{color:#fff;font-weight:600}.select{width:100%;padding:11px;border-radius:14px;background:#111;color:#fff;border:1px solid var(--line);outline:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:12px;border-radius:16px;text-align:left;color:#fff;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);cursor:pointer}.choice.active{background:rgba(255,255,255,.11);outline:1px solid rgba(255,255,255,.26)}.choice b{display:block;font-size:.68rem}.choice span{display:block;margin-top:3px;font-size:.55rem;color:var(--muted)}.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.055)}.switch-row:last-child{border-bottom:0}.copy b{display:block;font-size:.68rem}.copy span{display:block;margin-top:3px;font-size:.55rem;color:var(--muted)}.switch{width:48px;height:27px;position:relative;flex:0 0 auto}.switch input{position:absolute;opacity:0}.switch-ui{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.08);transition:.22s}.switch-ui:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:.22s}.switch input:checked+.switch-ui{background:var(--success)}.switch input:checked+.switch-ui:after{transform:translateX(21px)}
.toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:999px;background:rgba(18,18,18,.78);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.86);font-size:.72rem;backdrop-filter:blur(16px);transition:.28s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.quick-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:450px){.quick-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="app">
  <div class="status-row"><div class="status" id="status"><i class="fa-solid fa-circle"></i><span>conectando</span></div></div>

  <section class="glass preview-shell" aria-label="Prévia real do Mirror">
    <div class="preview-frame"><iframe id="mirror-preview" title="Prévia do Mirror" loading="eager"></iframe></div>
  </section>

  <section class="glass message-box" aria-label="Enviar mensagem">
    <div class="composer">
      <textarea id="message-input" class="message-input" maxlength="180" placeholder="Escreva uma mensagem para aparecer no Mirror…"></textarea>
      <div class="action-col"><button id="send-message" class="btn primary" aria-label="Enviar mensagem"><i class="fa-solid fa-arrow-up"></i></button><button id="clear-message" class="btn danger" aria-label="Apagar mensagem"><i class="fa-solid fa-xmark"></i></button></div>
    </div>
    <div class="duration-row">
      <div class="duration-label"><span>Duração da mensagem</span><span class="duration-value" id="duration-value">8s</span></div>
      <div class="duration-picker">
        <select id="duration-unit" class="duration-unit" aria-label="Unidade da duração">
          <option value="seconds">Segundos</option>
          <option value="minutes">Minutos</option>
          <option value="hours">Horas</option>
        </select>
        <input id="message-duration" class="range" type="range" min="3" max="60" step="1" value="8">
      </div>
    </div>
    <div class="meta-row"><span id="message-status">Nenhuma mensagem ativa</span><span id="message-countdown">—</span><span><strong id="char-count">0</strong>/180</span></div>
  </section>

  <div class="section-title">Ações rápidas</div>
  <section class="quick-grid">
    <button class="glass quick" id="quick-eco"><div class="quick-head"><i class="fa-regular fa-moon"></i><span class="quick-state" id="eco-state">OFF</span></div><b>Modo Eco</b><small>Escurecer</small></button>
    <button class="glass quick" id="quick-immersion"><div class="quick-head"><i class="fa-solid fa-cloud-rain"></i><span class="quick-state" id="immersion-state">OFF</span></div><b>Imersão</b><small>Efeitos de Clima</small></button>
    <button class="glass quick" id="quick-clock"><div class="quick-head"><i class="fa-regular fa-clock"></i><span class="quick-state" id="clock-state">ON</span></div><b>Relógio</b><small>Barra Info</small></button>
    <button class="glass quick" id="quick-footer"><div class="quick-head"><i class="fa-solid fa-layer-group"></i><span class="quick-state" id="footer-state">ON</span></div><b>Barra Base</b><small>Visibilidade</small></button>
    <button class="glass quick" id="quick-bigclock"><div class="quick-head"><i class="fa-solid fa-expand"></i><span class="quick-state" id="bigclock-state">OFF</span></div><b>Hora Topo</b><small>Gigante</small></button>
  </section>

  <div class="section-title">Configurações</div>
  <section class="settings-grid">
    <button class="glass setting" data-sheet="clock"><div class="setting-icon"><i class="fa-regular fa-clock"></i></div><b>Relógio</b><span id="sum-clock">Visível</span></button>
    <button class="glass setting" data-sheet="center"><div class="setting-icon"><i class="fa-brands fa-spotify"></i></div><b>Spotify & centro</b><span id="sum-center">Somente barra</span></button>
    <button class="glass setting" data-sheet="footer"><div class="setting-icon"><i class="fa-solid fa-layer-group"></i></div><b>Barra inferior</b><span id="sum-footer">Clima • Spotify • hora</span></button>
    <button class="glass setting" data-sheet="glass"><div class="setting-icon"><i class="fa-solid fa-droplet"></i></div><b>Vidro</b><span id="sum-glass">3% • 10px • 16px</span></button>
    <button class="glass setting" data-sheet="sizes"><div class="setting-icon"><i class="fa-solid fa-text-height"></i></div><b>Tamanhos</b><span id="sum-sizes">115% • 115% • 100%</span></button>
    <button class="glass setting" data-sheet="photos"><div class="setting-icon"><i class="fa-regular fa-images"></i></div><b>Fotos</b><span id="sum-photos">Troca a cada 20s</span></button>
  </section>
</div>

<div class="sheet" id="sheet"><div class="sheet-card"><div class="handle"></div><div class="sheet-head"><b id="sheet-title">Ajustar</b><button class="close" id="sheet-close"><i class="fa-solid fa-xmark"></i></button></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast"></div>

<!-- CÓDIGO EMBUTIDO DO MIRROR -->
<textarea id="embedded-mirror-code" style="display:none;">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MagicMirror Dashboard Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; --text-color: #ffffff; --shadow: 0 2px 10px rgba(0, 0, 0, 0.4); --glass-opacity: 0.03; --glass-bg: rgba(255, 255, 255, var(--glass-opacity)); --glass-border: rgba(255, 255, 255, 0.08); --glass-blur-val: 10px; --glass-blur: blur(var(--glass-blur-val)); --glass-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); --card-radius: 16px; --text-scale: 1.15; --icon-scale: 1.15; --spotify-scale: 1.0; --vinyl-scale: 1.0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; color: var(--text-color); font-family: var(--font-family); cursor: default; transition: filter 0.8s ease; }
        
        body.eco-mode { filter: brightness(0.35); }
        
        #bg-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; }
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .bg-layer.active { opacity: 1; }
        #bg-spotify { z-index: 3; filter: blur(35px) brightness(0.4); transform: scale(1.15); }
        
        /* OVERLAY DE IMERSÃO CLIMÁTICA */
        .weather-overlay { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 1s ease; }
        .weather-overlay.active { opacity: 1; }
        /* Chuva (Rain) */
        .weather-overlay.rain {
            background-image: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.4));
            background-size: 2px 80px;
            background-repeat: repeat;
            animation: rainFall 0.7s linear infinite;
        }
        @keyframes rainFall { 0% { background-position: 0% 0%, 20% -50%; } 100% { background-position: 10% 100vh, 30% 120vh; } }
        /* Neve (Snow) */
        .weather-overlay.snow {
            background-image: radial-gradient(circle, rgba(255,255,255,0.8) 2px, transparent 2px);
            background-size: 80px 80px;
            animation: snowFall 4s linear infinite;
        }
        @keyframes snowFall { 0% { background-position: 0px 0px, 40px 40px; } 100% { background-position: 20px 100vh, 60px 100vh; } }
        /* Neblina (Fog) */
        .weather-overlay.fog {
            background: rgba(255,255,255,0.15);
            filter: blur(20px);
            animation: fogDrift 15s ease-in-out infinite alternate;
        }
        @keyframes fogDrift { 0% { opacity: 0.3; transform: scale(1); } 100% { opacity: 0.7; transform: scale(1.1) translateX(20px); } }

        .mirror-container { display: flex; flex-direction: column; justify-content: flex-end; height: 100vh; padding: 1.5rem; position: relative; z-index: 5; background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.3) 100%); transition: filter 0.5s ease; width: 100%; max-width: 100%; }
        
        #big-clock-container { position: absolute; top: 6%; left: 50%; transform: translateX(-50%); text-align: center; z-index: 15; text-shadow: 0 5px 20px rgba(0,0,0,0.9); opacity: 1; transition: opacity 0.5s ease; }
        .big-time { font-size: calc(7.5rem * var(--text-scale)); font-weight: 200; letter-spacing: -3px; line-height: 1; }
        .big-date { font-size: calc(1.5rem * var(--text-scale)); font-weight: 400; opacity: 0.85; margin-top: 8px; text-transform: capitalize; }
        
        /* 1. CAPA ANIMADA SIMPLES */
        .animated-cover-wrapper { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%) scale(var(--vinyl-scale)); z-index: 10; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .animated-cover-img { width: 420px; height: 420px; border-radius: 12px; animation: floatPulse 6s ease-in-out infinite; }
        
        /* 2. CAPA ANIMADA + PROGRESSO (NOVO) */
        .progress-player-wrapper { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%) scale(var(--vinyl-scale)); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; width: 440px; }
        .progress-cover-glow { position: relative; width: 420px; height: 420px; border-radius: 12px; animation: floatPulse 6s ease-in-out infinite; box-shadow: 0 30px 60px rgba(0,0,0,0.9); }
        /* Efeito de Aura (Glow) por trás da capa */
        .progress-cover-glow::before { content: ""; position: absolute; inset: -15px; border-radius: 20px; background: inherit; filter: blur(30px) saturate(150%) brightness(0.8); opacity: 0.6; z-index: -1; animation: pulseGlow 4s ease-in-out infinite alternate; }
        .progress-cover { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; position: relative; z-index: 1; }
        .progress-ui { width: 400px; margin-top: 35px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.4); padding: 12px 20px; border-radius: 99px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .time-text { font-size: 0.85rem; font-weight: 500; color: rgba(255,255,255,0.8); width: 40px; text-align: center; }
        .progress-bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden; position: relative; }
        .progress-bar-fill { height: 100%; background: #fff; width: 0%; border-radius: 99px; transition: width 1s linear; box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        
        @keyframes floatPulse { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.02); } 100% { transform: translateY(0) scale(1); } }
        @keyframes pulseGlow { 0% { opacity: 0.4; transform: scale(0.95); } 100% { opacity: 0.75; transform: scale(1.05); } }

        /* TOCA DISCOS */
        .turntable-wrapper { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%) scale(var(--vinyl-scale)); z-index: 10; width: 480px; height: 480px; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .vinyl-record { width: 400px; height: 400px; border-radius: 50%; background: repeating-radial-gradient( #0f0f0f, #0f0f0f 4px, #1c1c1c 5px, #0f0f0f 6px ); box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 25px rgba(0,0,0,1), 0 0 0 6px #050505; position: relative; display: flex; align-items: center; justify-content: center; animation: spin 3.5s linear infinite; animation-play-state: paused; }
        .turntable-wrapper.playing .vinyl-record { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .vinyl-cover { width: 35%; height: 35%; border-radius: 50%; object-fit: cover; box-shadow: 0 0 15px rgba(0,0,0,0.9); border: 2px solid #111; }
        .vinyl-hole { position: absolute; width: 12px; height: 12px; background: #000; border-radius: 50%; box-shadow: inset 0 0 4px rgba(255,255,255,0.4); }
        .tonearm { position: absolute; top: 30px; right: 15px; width: 120px; height: 336px; z-index: 11; transform-origin: 60px 60px; transform: rotate(-22deg); transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(15px 15px 15px rgba(0,0,0,0.7)); }
        .turntable-wrapper.playing .tonearm { transform: rotate(18deg); }
        
        .hidden-center { opacity: 0 !important; pointer-events: none !important; transform: translate(-50%, -30%) scale(calc(var(--vinyl-scale) * 0.7)) !important; }
        .config-hidden { opacity: 0; pointer-events: none; display: none !important; }

        /* CARD INFERIOR E RODAPÉ */
        .footer { width: 100%; text-shadow: var(--shadow); position: relative; z-index: 15; }
        .glass-card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--card-radius); padding: 12px 22px; margin-bottom: 0.8rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 15px; width: 100%; max-width: 100%; overflow: hidden; transition: background 0.3s ease, border-color 0.3s ease; }
        .temp-main { font-size: calc(2.4rem * var(--text-scale)); font-weight: 300; display: flex; align-items: center; gap: 10px; line-height: 1; flex-shrink: 0; white-space: nowrap; }
        .temp-main i { font-size: calc(1.7rem * var(--icon-scale)); opacity: 0.9; }
        .spotify-widget { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0; justify-content: center; transform: scale(var(--spotify-scale)); transform-origin: center; transition: opacity 0.4s ease, transform 0.3s ease; }
        .spotify-widget.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; display: none !important; }
        .spotify-cover { width: calc(40px * var(--icon-scale)); height: calc(40px * var(--icon-scale)); border-radius: 8px; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.3); flex-shrink: 0; transition: all 0.3s ease; }
        .spotify-info { display: flex; flex-direction: column; min-width: 0; overflow: hidden; text-align: left; }
        .spotify-title { font-size: calc(0.9rem * var(--text-scale)); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .spotify-artist { font-size: calc(0.75rem * var(--text-scale)); opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .spotify-widget.large-cover-mode { flex-direction: column; text-align: center; }
        .spotify-widget.large-cover-mode .spotify-cover { width: calc(85px * var(--icon-scale)); height: calc(85px * var(--icon-scale)); border-radius: 12px; margin-bottom: 4px; }
        .spotify-widget.large-cover-mode .spotify-info { text-align: center; }
        .weather-details { font-size: calc(0.9rem * var(--text-scale)); text-align: right; opacity: 0.9; line-height: 1.25; flex-shrink: 0; white-space: nowrap; }
        .time-date { font-size: calc(0.8rem * var(--text-scale)); opacity: 0.8; font-weight: 400; margin-bottom: 2px; }
        .city-title { font-weight: 600; font-size: calc(0.95rem * var(--text-scale)); }
        .wind-info { font-size: calc(0.8rem * var(--text-scale)); opacity: 0.75; margin-top: 2px; }
        .wind-info i { font-size: calc(0.85rem * var(--icon-scale)); }

            tick();

        let isFetchingWeather = false, lastWeatherHash = "";

                    } 
                    else if (userSettings.spotifyMode === 'animated') {

                    else { hideCenterExtras(); }
                } else { isPlayingMusic = false; widget.classList.add('hidden'); lastSongTitle = ""; hideCenterExtras(); }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyD9uRiFDp3WZEg9BHjpN9QBszL1L7zY6qc",authDomain:"mirror-3bd2e.firebaseapp.com",databaseURL:"https://mirror-3bd2e-default-rtdb.firebaseio.com",projectId:"mirror-3bd2e",storageBucket:"mirror-3bd2e.firebasestorage.app",messagingSenderId:"172125779031",appId:"1:172125779031:web:1bb19ae1fe89d71cafdf12"};
const db=getDatabase(initializeApp(firebaseConfig));
const settingsRef=ref(db,"mirror_config");

const defaults={textScale:115,iconScale:115,spotifyScale:100,vinylSize:100,spotifyMode:"standard",glassOpacity:3,glassBlur:10,cardRadius:16,showTemp:true,showSpotify:true,showClock:true,showForecast:true,ecoMode:false,immersionMode:false,showBigClock:false,showFooter:true,photoInterval:20,message:{text:"",duration:8,updatedAt:0,id:0,expiresAt:0}};
const $=id=>document.getElementById(id);
let state={...defaults,message:{...defaults.message}},ready=false,writeTimer=null;

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function normalizeMessage(m){if(!m||typeof m!=="object")return {...defaults.message};return {text:String(m.text||"").trim(),duration:clamp(Number(m.duration)||8,3,86400),updatedAt:Number(m.updatedAt)||0,id:Number(m.id)||0,expiresAt:Number(m.expiresAt)||0};}
function formatDuration(sec){sec=Math.round(Number(sec)||0);if(sec<60)return sec+"s";const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);if(h)return m?h+"h "+m+"min":h+"h";return m+"min";}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.classList.remove("show"),1700);}
function normalizeState(data){return {...defaults,...data,message:{...defaults.message,...(data?.message||{})}};}

let countdownTimer=null;
function formatRemaining(ms){
  if(ms<=0) return '—';
  let total=Math.floor(ms/1000);
  const d=Math.floor(total/86400); total%=86400;
  const h=Math.floor(total/3600); total%=3600;
  const m=Math.floor(total/60); const sec=total%60;
  if(d>0) return `${d}d ${String(h).padStart(2,'0')}h`;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m`;
  if(m>0) return `${m}m ${String(sec).padStart(2,'0')}s`;
  return `${sec}s`;
}

function startMessageCountdown(message){
  clearInterval(countdownTimer);
  const el=$("message-countdown");
  const statusEl=$("message-status");
  const now = Date.now();
  if(!message?.text || (message.expiresAt && now >= message.expiresAt)){ el.textContent='—'; return; }
  const expiresAt=Number(message.expiresAt)||((Number(message.updatedAt)||now)+(Number(message.duration)||8)*1000);
  function tick(){
    const left=expiresAt-Date.now();
    if(left>0){ el.textContent=`resta ${formatRemaining(left)}`; } 
    else { clearInterval(countdownTimer); el.textContent='—'; statusEl.textContent="Nenhuma mensagem ativa"; }
  }
  tick(); countdownTimer=setInterval(tick,1000);
}

function durationParts(seconds){ seconds=Number(seconds)||8; if(seconds%3600===0 && seconds>=3600) return ['hours',seconds/3600]; if(seconds%60===0 && seconds>=60) return ['minutes',seconds/60]; return ['seconds',seconds]; }
function durationToSeconds(unit,value){ value=Number(value)||1; if(unit==='hours') return clamp(value*3600,3,86400); if(unit==='minutes') return clamp(value*60,3,86400); return clamp(value,3,60); }

function updateUI(s){
  $("eco-state").textContent=s.ecoMode?"ON":"OFF";$("quick-eco").classList.toggle("active",!!s.ecoMode);
  $("immersion-state").textContent=s.immersionMode?"ON":"OFF";$("quick-immersion").classList.toggle("active",!!s.immersionMode);
  $("clock-state").textContent=s.showClock===false?"OFF":"ON";$("quick-clock").classList.toggle("active",s.showClock!==false);
  $("footer-state").textContent=s.showFooter===false?"OFF":"ON";$("quick-footer").classList.toggle("active",s.showFooter!==false);
  $("bigclock-state").textContent=s.showBigClock?"ON":"OFF";$("quick-bigclock").classList.toggle("active",!!s.showBigClock);
  
  const centers={standard:"Somente barra",vinyl:"Toca-discos",animated:"Capa animada","animated-progress":"Capa + Progresso","large-cover":"Card lateral"};
  $("sum-clock").textContent=s.showClock===false?"Oculto":(s.showBigClock?"Visível • hora grande":"Visível");
  $("sum-center").textContent=centers[s.spotifyMode]||"Somente barra";
  const parts=[];if(s.showTemp)parts.push("Clima");if(s.showSpotify)parts.push("Spotify");if(s.showClock)parts.push("hora");$("sum-footer").textContent=s.showFooter===false?"Oculta":(parts.join(" • ")||"Sem módulos");

  $("sum-sizes").textContent=`${s.textScale}% • ${s.iconScale}% • ${s.spotifyScale}%`;
  $("sum-photos").textContent=`Troca a cada ${s.photoInterval||20}s`;
  
  const msg=normalizeMessage(s.message);
  const isExpired = msg.expiresAt && Date.now() >= msg.expiresAt;
  $("message-status").textContent=(msg.text && !isExpired)?`Mensagem ativa • ${formatDuration(msg.duration)}`:"Nenhuma mensagem ativa";
  startMessageCountdown(msg); $("char-count").textContent=$("message-input").value.length;

function savePatch(patch){state={...state,...patch};updateUI(state);clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{try{await set(settingsRef,state);}catch(e){toast("Erro ao salvar");}},80);}
async function saveMessage(message){state={...state,message};updateUI(state);try{await set(settingsRef,state);toast("Mensagem enviada");}catch(e){toast("Erro ao enviar");}}

function loadMirrorPreview() { document.getElementById('mirror-preview').srcdoc = document.getElementById('embedded-mirror-code').value; }
loadMirrorPreview();

onValue(settingsRef,snap=>{ const data=snap.val(); if(data){state=normalizeState(data);ready=true;updateUI(state);syncDurationUI(normalizeMessage(state.message).duration);$("status").classList.add("ok");$("status").innerHTML='<i class="fa-solid fa-circle"></i><span>conectado</span>';}else set(settingsRef,defaults); });

$("message-input").addEventListener("input",()=>$("char-count").textContent=$("message-input").value.length);
$("message-input").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();$("send-message").click();}});

function syncDurationUI(seconds){ const [unit,val]=durationParts(seconds); $("duration-unit").value=unit; const slider=$("message-duration"); slider.max=unit==='hours'?24:(unit==='minutes'?60:60); slider.min=unit==='seconds'?3:1; slider.value=val; $("duration-value").textContent=formatDuration(seconds); }
function currentDuration(){return durationToSeconds($("duration-unit").value,$("message-duration").value);}

$("duration-unit").addEventListener("change",()=>{ const unit=$("duration-unit").value; const slider=$("message-duration"); if(unit==='hours'){slider.min=1;slider.max=24;slider.value=1;} else if(unit==='minutes'){slider.min=1;slider.max=60;slider.value=1;} else {slider.min=3;slider.max=60;slider.value=3;} $("duration-value").textContent=formatDuration(currentDuration()); });
$("message-duration").addEventListener("input",e=>{ $("duration-value").textContent=formatDuration(currentDuration()); });

$("send-message").onclick=async()=>{ const text=$("message-input").value.trim(); if(!text){toast("Escreva uma mensagem");$("message-input").focus();return;} const duration=currentDuration(),id=Date.now(),now=Date.now(); $("message-input").value = ""; $("char-count").textContent = "0"; await saveMessage({text,duration,updatedAt:now,id,expiresAt:now+duration*1000}); };
$("clear-message").onclick=async()=>{ const id=Date.now(); try{ await saveMessage({text:"",duration:3,updatedAt:id,id,expiresAt:id}); $("message-input").value=""; $("char-count").textContent="0"; toast("Mensagem apagada"); }catch(e){} };

async function setQuick(key,value,label){savePatch({[key]:value});toast(label);}
$("quick-eco").onclick=()=>setQuick("ecoMode",!state.ecoMode,state.ecoMode?"Modo Eco desativado":"Modo Eco ativado");
$("quick-immersion").onclick=()=>setQuick("immersionMode",!state.immersionMode,state.immersionMode?"Imersão desativada":"Imersão ativada");
$("quick-clock").onclick=()=>setQuick("showClock",state.showClock===false,"Relógio "+(state.showClock===false?"ativado":"ocultado"));
$("quick-footer").onclick=()=>setQuick("showFooter",state.showFooter===false,"Barra inferior "+(state.showFooter===false?"exibida":"ocultada"));
$("quick-bigclock").onclick=()=>setQuick("showBigClock",!state.showBigClock,"Hora grande "+(!state.showBigClock?"ativada":"desativada"));

function openSheet(kind){
  const body=$("sheet-body"),title=$("sheet-title");let html="";
  if(kind==="clock"){
    title.textContent="Relógio";html=`<div class="switch-row"><div class="copy"><b>Relógio da barra</b><span>Mostra hora e data no Mirror</span></div><label class="switch"><input id="s-clock" type="checkbox" ${state.showClock!==false?"checked":""}><span class="switch-ui"></span></label></div><div class="switch-row"><div class="copy"><b>Hora grande</b><span>Relógio destacado no topo</span></div><label class="switch"><input id="s-big" type="checkbox" ${state.showBigClock?"checked":""}><span class="switch-ui"></span></label></div>`;

    title.textContent="Spotify & centro";html=`<div class="field"><div class="field-label"><span>Visualização central</span></div><div class="choices"><button class="choice" data-center="standard"><b>Somente barra</b><span>Sem elemento central</span></button><button class="choice" data-center="vinyl"><b>Toca-discos</b><span>Vinil girando</span></button><button class="choice" data-center="animated"><b>Capa animada</b><span>Capa flutuando</span></button><button class="choice" data-center="animated-progress"><b>Capa + Progresso</b><span>Capa e tempo da música</span></button><button class="choice" style="grid-column: span 2;" data-center="large-cover"><b>Card lateral</b><span>Destaque do player</span></button></div></div><div class="field"><div class="field-label"><span>Tamanho da capa / vinil</span><span class="field-value" id="v-vinyl">${state.vinylSize}%</span></div><input id="s-vinyl" class="range" type="range" min="60" max="180" value="${state.vinylSize}"></div><div class="switch-row"><div class="copy"><b>Spotify na barra</b><span>Mostrar ou ocultar o mini player</span></div><label class="switch"><input id="s-spotify" type="checkbox" ${state.showSpotify!==false?"checked":""}><span class="switch-ui"></span></label></div>`;

  } else if(kind==="glass"){
    title.textContent="Vidro";html=`<div class="field"><div class="field-label"><span>Transparência</span><span class="field-value" id="v-opacity">${state.glassOpacity}%</span></div><input id="s-opacity" class="range" type="range" min="0" max="40" value="${state.glassOpacity}"></div><div class="field"><div class="field-label"><span>Desfoque</span><span class="field-value" id="v-blur">${state.glassBlur}px</span></div><input id="s-blur" class="range" type="range" min="0" max="25" value="${state.glassBlur}"></div><div class="field"><div class="field-label"><span>Arredondamento</span><span class="field-value" id="v-radius">${state.cardRadius}px</span></div><input id="s-radius" class="range" type="range" min="4" max="30" value="${state.cardRadius}"></div>`;

  } else if(kind==="photos"){

  body.innerHTML=html;$("sheet").classList.add("open");wireSheet(kind);

function debouncePatch(patch){clearTimeout(window.__patch);window.__patch=setTimeout(()=>savePatch(patch),90);}
function wireSheet(kind){
  const on=(id,fn)=>{const e=$(id);if(e)e.onchange=fn};
  if(kind==="clock"){on("s-clock",e=>savePatch({showClock:e.target.checked}));on("s-big",e=>savePatch({showBigClock:e.target.checked}));}
  if(kind==="center"){
    document.querySelectorAll("[data-center]").forEach(b=>{b.classList.toggle("active",b.dataset.center===state.spotifyMode);b.onclick=()=>{savePatch({spotifyMode:b.dataset.center});openSheet("center");}});
    const v=$("s-vinyl");v.oninput=()=>{$("v-vinyl").textContent=v.value+"%";debouncePatch({vinylSize:Number(v.value)})};on("s-spotify",e=>savePatch({showSpotify:e.target.checked}));
  }
  if(kind==="footer"){on("s-footer",e=>savePatch({showFooter:e.target.checked}));on("s-temp",e=>savePatch({showTemp:e.target.checked}));on("s-mini",e=>savePatch({showClock:e.target.checked}));on("s-forecast",e=>savePatch({showForecast:e.target.checked}));}
  if(kind==="glass")[["s-opacity","v-opacity","glassOpacity","%"],["s-blur","v-blur","glassBlur","px"],["s-radius","v-radius","cardRadius","px"]].forEach(([i,v,k,u])=>{const r=$(i);r.oninput=()=>{$(v).textContent=r.value+u;debouncePatch({[k]:Number(r.value)})}});
  if(kind==="sizes")[["s-text","v-text","textScale"],["s-icon","v-icon","iconScale"],["s-spotify-scale","v-spotify-scale","spotifyScale"]].forEach(([i,v,k])=>{const r=$(i);r.oninput=()=>{$(v).textContent=r.value+"%";debouncePatch({[k]:Number(r.value)})}});
  if(kind==="photos"){const r=$("s-photo");r.oninput=()=>{$("v-photo").textContent=r.value+"s";debouncePatch({photoInterval:Number(r.value)})};}

document.querySelectorAll("[data-sheet]").forEach(e=>e.onclick=()=>openSheet(e.dataset.sheet));
$("sheet-close").onclick=()=>$("sheet").classList.remove("open");$("sheet").onclick=e=>{if(e.target===$("sheet"))$("sheet").classList.remove("open")};
