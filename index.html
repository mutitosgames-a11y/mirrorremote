<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Mirror Control</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#050505;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.095);--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.55);--success:#75e6a0;--danger:#ff7884;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:#fff} body{padding:12px 10px calc(20px + var(--safe));overflow-x:hidden}
.app{width:min(760px,100%);margin:auto}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px)}
.status-row{display:flex;justify-content:flex-end;align-items:center;padding:2px 4px 9px}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.65rem}.status i{font-size:.4rem;color:#777}.status.ok i{color:var(--success)}
.preview-shell{padding:6px;border-radius:27px}.preview-frame{width:100%;aspect-ratio:16/10;min-height:235px;border-radius:21px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
.preview-frame iframe{display:block;width:100%;height:100%;border:0;background:#000}
.message-box{margin-top:9px;padding:11px;border-radius:22px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.message-input{min-width:0;min-height:58px;max-height:150px;resize:none;border:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.16);border-radius:16px;color:#fff;padding:11px 12px;font-size:.88rem;outline:none}.message-input::placeholder{color:rgba(255,255,255,.28)}
.action-col{display:grid;gap:7px}.btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.06);color:#fff;cursor:pointer}.btn.primary{background:#fff;color:#111;border-color:#fff}.btn.danger{color:var(--danger);background:rgba(255,120,132,.08)}.meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding:0 2px;color:var(--muted);font-size:.6rem}.meta-row strong{color:#fff;font-weight:600}.duration-row{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.055)}.duration-label{display:flex;justify-content:space-between;font-size:.64rem;color:var(--muted);margin-bottom:5px}.duration-value{color:#fff;font-weight:600}.range{width:100%;accent-color:#fff;height:20px;cursor:pointer}
.section-title{margin:16px 3px 8px;font-size:.64rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick{border-radius:19px;padding:11px;min-height:78px;text-align:left;color:#fff;cursor:pointer}.quick:active,.setting:active,.choice:active,.btn:active{transform:scale(.985)}.quick-head{display:flex;align-items:center;justify-content:space-between;color:rgba(255,255,255,.78)}.quick-state{font-size:.52rem;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}.quick.active .quick-state{background:rgba(117,230,160,.10);color:var(--success)}.quick b{display:block;margin-top:12px;font-size:.68rem;font-weight:650}.quick small{display:block;margin-top:3px;font-size:.53rem;color:var(--muted)}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.setting{display:block;width:100%;min-height:76px;text-align:left;border-radius:19px;padding:12px;color:#fff;cursor:pointer}.setting-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.06);font-size:.72rem;margin-bottom:9px}.setting b{display:block;font-size:.69rem;font-weight:650}.setting span{display:block;margin-top:3px;font-size:.55rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.46);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.sheet.open{display:flex}.sheet-card{width:min(760px,100%);max-height:82vh;overflow:auto;margin:auto auto 0;border-radius:28px 28px 0 0;background:rgba(16,16,16,.92);border:1px solid var(--line);border-bottom:0;box-shadow:0 -30px 80px rgba(0,0,0,.5);padding:9px 15px calc(18px + var(--safe));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}.handle{width:40px;height:4px;background:rgba(255,255,255,.17);border-radius:99px;margin:3px auto 13px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-head b{font-size:.9rem}.close{width:35px;height:35px;border:0;border-radius:50%;background:rgba(255,255,255,.07);color:#fff}.field{margin:12px 0}.field-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:var(--muted);font-size:.67rem}.field-value{color:#fff;font-weight:600}.select{width:100%;padding:11px;border-radius:14px;background:#111;color:#fff;border:1px solid var(--line);outline:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:12px;border-radius:16px;text-align:left;color:#fff;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);cursor:pointer}.choice.active{background:rgba(255,255,255,.11);outline:1px solid rgba(255,255,255,.26)}.choice b{display:block;font-size:.68rem}.choice span{display:block;margin-top:3px;font-size:.55rem;color:var(--muted)}.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.055)}.switch-row:last-child{border-bottom:0}.copy b{display:block;font-size:.68rem}.copy span{display:block;margin-top:3px;font-size:.55rem;color:var(--muted)}.switch{width:48px;height:27px;position:relative;flex:0 0 auto}.switch input{position:absolute;opacity:0}.switch-ui{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.08);transition:.22s}.switch-ui:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:.22s}.switch input:checked+.switch-ui{background:var(--success)}.switch input:checked+.switch-ui:after{transform:translateX(21px)}
.toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:999px;background:rgba(18,18,18,.78);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.86);font-size:.72rem;backdrop-filter:blur(16px);transition:.28s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){body{padding-left:7px;padding-right:7px}.preview-shell{padding:5px;border-radius:23px}.preview-frame{aspect-ratio:10/7;min-height:220px;border-radius:18px}.quick-grid{grid-template-columns:1fr 1fr}.settings-grid{grid-template-columns:1fr 1fr}.composer{grid-template-columns:1fr}.action-col{grid-template-columns:1fr 1fr}.btn{width:100%;height:44px}.message-input{min-height:70px}.choices{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.settings-grid{grid-template-columns:1fr}.preview-frame{min-height:205px}.choice{padding:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="status-row"><div class="status" id="status"><i class="fa-solid fa-circle"></i><span>conectando</span></div></div>

  <section class="glass preview-shell" aria-label="Prévia real do Mirror">
    <div class="preview-frame"><iframe id="mirror-preview" title="Prévia do Mirror" loading="eager"></iframe></div>
  </section>

  <section class="glass message-box" aria-label="Enviar mensagem">
    <div class="composer">
      <textarea id="message-input" class="message-input" maxlength="180" placeholder="Escreva uma mensagem para aparecer no Mirror…"></textarea>
      <div class="action-col"><button id="send-message" class="btn primary" aria-label="Enviar mensagem"><i class="fa-solid fa-arrow-up"></i></button><button id="clear-message" class="btn danger" aria-label="Apagar mensagem"><i class="fa-solid fa-xmark"></i></button></div>
    </div>
    <div class="duration-row"><div class="duration-label"><span>Duração da mensagem</span><span class="duration-value" id="duration-value">8s</span></div><input id="message-duration" class="range" type="range" min="3" max="86400" value="8"></div>
    <div class="meta-row"><span id="message-status">Nenhuma mensagem ativa</span><span><strong id="char-count">0</strong>/180</span></div>
  </section>

  <div class="section-title">Ações rápidas</div>
  <section class="quick-grid">
    <button class="glass quick" id="quick-eco"><div class="quick-head"><i class="fa-regular fa-moon"></i><span class="quick-state" id="eco-state">OFF</span></div><b>Modo Eco</b><small>Escurecer tela</small></button>
    <button class="glass quick" id="quick-clock"><div class="quick-head"><i class="fa-regular fa-clock"></i><span class="quick-state" id="clock-state">ON</span></div><b>Relógio</b><small>Mostrar / ocultar</small></button>
    <button class="glass quick" id="quick-footer"><div class="quick-head"><i class="fa-solid fa-layer-group"></i><span class="quick-state" id="footer-state">ON</span></div><b>Barra inferior</b><small>Mostrar / ocultar</small></button>
    <button class="glass quick" id="quick-bigclock"><div class="quick-head"><i class="fa-solid fa-expand"></i><span class="quick-state" id="bigclock-state">OFF</span></div><b>Hora grande</b><small>Destaque no topo</small></button>
  </section>

  <div class="section-title">Configurações</div>
  <section class="settings-grid">
    <button class="glass setting" data-sheet="clock"><div class="setting-icon"><i class="fa-regular fa-clock"></i></div><b>Relógio</b><span id="sum-clock">Visível</span></button>
    <button class="glass setting" data-sheet="center"><div class="setting-icon"><i class="fa-brands fa-spotify"></i></div><b>Spotify & centro</b><span id="sum-center">Somente barra</span></button>
    <button class="glass setting" data-sheet="footer"><div class="setting-icon"><i class="fa-solid fa-layer-group"></i></div><b>Barra inferior</b><span id="sum-footer">Clima • Spotify • hora</span></button>
    <button class="glass setting" data-sheet="glass"><div class="setting-icon"><i class="fa-solid fa-droplet"></i></div><b>Vidro</b><span id="sum-glass">3% • 10px • 16px</span></button>
    <button class="glass setting" data-sheet="sizes"><div class="setting-icon"><i class="fa-solid fa-text-height"></i></div><b>Tamanhos</b><span id="sum-sizes">115% • 115% • 100%</span></button>
    <button class="glass setting" data-sheet="photos"><div class="setting-icon"><i class="fa-regular fa-images"></i></div><b>Fotos</b><span id="sum-photos">Troca a cada 20s</span></button>
  </section>
</div>

<div class="sheet" id="sheet"><div class="sheet-card"><div class="handle"></div><div class="sheet-head"><b id="sheet-title">Ajustar</b><button class="close" id="sheet-close"><i class="fa-solid fa-xmark"></i></button></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyD9uRiFDp3WZEg9BHjpN9QBszL1L7zY6qc",authDomain:"mirror-3bd2e.firebaseapp.com",databaseURL:"https://mirror-3bd2e-default-rtdb.firebaseio.com",projectId:"mirror-3bd2e",storageBucket:"mirror-3bd2e.firebasestorage.app",messagingSenderId:"172125779031",appId:"1:172125779031:web:1bb19ae1fe89d71cafdf12"};
const db=getDatabase(initializeApp(firebaseConfig));
const settingsRef=ref(db,"mirror_config");
const MIRROR_URLS=["mirror_v2.html","mirror.html"];
const defaults={textScale:115,iconScale:115,spotifyScale:100,vinylSize:100,spotifyMode:"standard",glassOpacity:3,glassBlur:10,cardRadius:16,showTemp:true,showSpotify:true,showClock:true,showForecast:true,ecoMode:false,showBigClock:false,showFooter:true,photoInterval:20,message:{text:"",duration:8,updatedAt:0,id:0}};
const $=id=>document.getElementById(id);
let state={...defaults,message:{...defaults.message}},ready=false,writeTimer=null;

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function normalizeMessage(m){if(!m||typeof m!=="object")return {...defaults.message};return {text:String(m.text||"").trim(),duration:clamp(Number(m.duration)||8,3,86400),updatedAt:Number(m.updatedAt)||0,id:Number(m.id)||0};}
function formatDuration(sec){sec=Math.round(Number(sec)||0);if(sec<60)return sec+"s";const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);if(h)return m?h+"h "+m+"min":h+"h";return m+"min";}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.classList.remove("show"),1700);}
function normalizeState(data){return {...defaults,...data,message:{...defaults.message,...(data?.message||{})}};}

function updateUI(s){
  $("eco-state").textContent=s.ecoMode?"ON":"OFF";$("quick-eco").classList.toggle("active",!!s.ecoMode);
  $("clock-state").textContent=s.showClock===false?"OFF":"ON";$("quick-clock").classList.toggle("active",s.showClock!==false);
  $("footer-state").textContent=s.showFooter===false?"OFF":"ON";$("quick-footer").classList.toggle("active",s.showFooter!==false);
  $("bigclock-state").textContent=s.showBigClock?"ON":"OFF";$("quick-bigclock").classList.toggle("active",!!s.showBigClock);
  const centers={standard:"Somente barra",vinyl:"Toca-discos",animated:"Capa animada","large-cover":"Card lateral"};
  $("sum-clock").textContent=s.showClock===false?"Oculto":(s.showBigClock?"Visível • hora grande":"Visível");
  $("sum-center").textContent=centers[s.spotifyMode]||"Somente barra";
  const parts=[];if(s.showTemp)parts.push("Clima");if(s.showSpotify)parts.push("Spotify");if(s.showClock)parts.push("hora");$("sum-footer").textContent=s.showFooter===false?"Oculta":(parts.join(" • ")||"Sem módulos");
  $("sum-glass").textContent=`${s.glassOpacity}% • ${s.glassBlur}px • ${s.cardRadius}px`;
  $("sum-sizes").textContent=`${s.textScale}% • ${s.iconScale}% • ${s.spotifyScale}%`;
  $("sum-photos").textContent=`Troca a cada ${s.photoInterval||20}s`;
  const msg=normalizeMessage(s.message);$("message-status").textContent=msg.text?`Mensagem ativa • ${formatDuration(msg.duration)}`:"Nenhuma mensagem ativa";
  if(document.activeElement!==$("message-input"))$("message-input").value=msg.text||"";
  $("char-count").textContent=$("message-input").value.length;
  $("message-duration").value=msg.duration;$('duration-value').textContent=formatDuration(msg.duration);
}

function savePatch(patch){state={...state,...patch};updateUI(state);clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{try{await set(settingsRef,state);}catch(e){toast("Erro ao salvar");}},80);}
async function saveMessage(message){state={...state,message};updateUI(state);try{await set(settingsRef,state);toast("Mensagem enviada");}catch(e){toast("Erro ao enviar");}}

// Prévia = o próprio Mirror. Não há uma segunda implementação visual.
const preview=$("mirror-preview");let previewTry=0;
function loadMirrorPreview(){const u=MIRROR_URLS[previewTry]||MIRROR_URLS[0];preview.src=u;preview.onerror=()=>{if(previewTry<MIRROR_URLS.length-1){previewTry++;loadMirrorPreview();}}}
loadMirrorPreview();

onValue(settingsRef,snap=>{
  const data=snap.val();
  if(data){state=normalizeState(data);ready=true;updateUI(state);$("status").classList.add("ok");$("status").innerHTML='<i class="fa-solid fa-circle"></i><span>conectado</span>';}else set(settingsRef,defaults);
});

$("message-input").addEventListener("input",()=>$("char-count").textContent=$("message-input").value.length);
$("message-input").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();$("send-message").click();}});
$("message-duration").addEventListener("input",e=>{$("duration-value").textContent=formatDuration(e.target.value);});
$("send-message").onclick=async()=>{const text=$("message-input").value.trim();if(!text){toast("Escreva uma mensagem");$("message-input").focus();return;}const duration=clamp(Number($("message-duration").value)||8,3,86400),id=Date.now();await saveMessage({text,duration,updatedAt:id,id});};
$("clear-message").onclick=async()=>{const id=Date.now();try{await saveMessage({text:"",duration:3,updatedAt:id,id});$("message-input").value="";$("char-count").textContent="0";toast("Mensagem apagada");}catch(e){}};

async function setQuick(key,value,label){savePatch({[key]:value});toast(label);}
$("quick-eco").onclick=()=>setQuick("ecoMode",!state.ecoMode,state.ecoMode?"Modo Eco desativado":"Modo Eco ativado");
$("quick-clock").onclick=()=>setQuick("showClock",state.showClock===false,"Relógio "+(state.showClock===false?"ativado":"ocultado"));
$("quick-footer").onclick=()=>setQuick("showFooter",state.showFooter===false,"Barra inferior "+(state.showFooter===false?"exibida":"ocultada"));
$("quick-bigclock").onclick=()=>setQuick("showBigClock",!state.showBigClock,"Hora grande "+(!state.showBigClock?"ativada":"desativada"));

function openSheet(kind){
  const body=$("sheet-body"),title=$("sheet-title");let html="";
  if(kind==="clock"){
    title.textContent="Relógio";html=`<div class="switch-row"><div class="copy"><b>Relógio da barra</b><span>Mostra hora e data no Mirror</span></div><label class="switch"><input id="s-clock" type="checkbox" ${state.showClock!==false?"checked":""}><span class="switch-ui"></span></label></div><div class="switch-row"><div class="copy"><b>Hora grande</b><span>Relógio destacado no topo</span></div><label class="switch"><input id="s-big" type="checkbox" ${state.showBigClock?"checked":""}><span class="switch-ui"></span></label></div>`;
  } else if(kind==="center"){
    title.textContent="Spotify & centro";html=`<div class="field"><div class="field-label"><span>Visualização central</span></div><div class="choices"><button class="choice" data-center="standard"><b>Somente barra</b><span>Sem elemento central</span></button><button class="choice" data-center="vinyl"><b>Toca-discos</b><span>Vinil girando</span></button><button class="choice" data-center="animated"><b>Capa animada</b><span>Capa flutuando</span></button><button class="choice" data-center="large-cover"><b>Card lateral</b><span>Destaque do player</span></button></div></div><div class="field"><div class="field-label"><span>Tamanho da capa / vinil</span><span class="field-value" id="v-vinyl">${state.vinylSize}%</span></div><input id="s-vinyl" class="range" type="range" min="60" max="180" value="${state.vinylSize}"></div><div class="switch-row"><div class="copy"><b>Spotify na barra</b><span>Mostrar ou ocultar o mini player</span></div><label class="switch"><input id="s-spotify" type="checkbox" ${state.showSpotify!==false?"checked":""}><span class="switch-ui"></span></label></div>`;
  } else if(kind==="footer"){
    title.textContent="Barra inferior";html=`<div class="switch-row"><div class="copy"><b>Barra inferior</b><span>Área principal de módulos</span></div><label class="switch"><input id="s-footer" type="checkbox" ${state.showFooter!==false?"checked":""}><span class="switch-ui"></span></label></div><div class="switch-row"><div class="copy"><b>Clima atual</b><span>Temperatura e ícone</span></div><label class="switch"><input id="s-temp" type="checkbox" ${state.showTemp?"checked":""}><span class="switch-ui"></span></label></div><div class="switch-row"><div class="copy"><b>Mini relógio</b><span>Hora/data dentro da barra</span></div><label class="switch"><input id="s-mini" type="checkbox" ${state.showClock!==false?"checked":""}><span class="switch-ui"></span></label></div><div class="switch-row"><div class="copy"><b>Previsão 4 dias</b><span>Cards abaixo da barra</span></div><label class="switch"><input id="s-forecast" type="checkbox" ${state.showForecast?"checked":""}><span class="switch-ui"></span></label></div>`;
  } else if(kind==="glass"){
    title.textContent="Vidro";html=`<div class="field"><div class="field-label"><span>Transparência</span><span class="field-value" id="v-opacity">${state.glassOpacity}%</span></div><input id="s-opacity" class="range" type="range" min="0" max="40" value="${state.glassOpacity}"></div><div class="field"><div class="field-label"><span>Desfoque</span><span class="field-value" id="v-blur">${state.glassBlur}px</span></div><input id="s-blur" class="range" type="range" min="0" max="25" value="${state.glassBlur}"></div><div class="field"><div class="field-label"><span>Arredondamento</span><span class="field-value" id="v-radius">${state.cardRadius}px</span></div><input id="s-radius" class="range" type="range" min="4" max="30" value="${state.cardRadius}"></div>`;
  } else if(kind==="sizes"){
    title.textContent="Tamanhos";html=`<div class="field"><div class="field-label"><span>Textos da barra</span><span class="field-value" id="v-text">${state.textScale}%</span></div><input id="s-text" class="range" type="range" min="80" max="160" value="${state.textScale}"></div><div class="field"><div class="field-label"><span>Ícones do clima</span><span class="field-value" id="v-icon">${state.iconScale}%</span></div><input id="s-icon" class="range" type="range" min="80" max="160" value="${state.iconScale}"></div><div class="field"><div class="field-label"><span>Tamanho mini player</span><span class="field-value" id="v-spotify-scale">${state.spotifyScale}%</span></div><input id="s-spotify-scale" class="range" type="range" min="70" max="150" value="${state.spotifyScale}"></div>`;
  } else if(kind==="photos"){
    title.textContent="Fotos";html=`<div class="field"><div class="field-label"><span>Intervalo de troca</span><span class="field-value" id="v-photo">${state.photoInterval||20}s</span></div><input id="s-photo" class="range" type="range" min="10" max="180" value="${state.photoInterval||20}"></div>`;
  }
  body.innerHTML=html;$("sheet").classList.add("open");wireSheet(kind);
}
function debouncePatch(patch){clearTimeout(window.__patch);window.__patch=setTimeout(()=>savePatch(patch),90);}
function wireSheet(kind){
  const on=(id,fn)=>{const e=$(id);if(e)e.onchange=fn};
  if(kind==="clock"){on("s-clock",e=>savePatch({showClock:e.target.checked}));on("s-big",e=>savePatch({showBigClock:e.target.checked}));}
  if(kind==="center"){
    document.querySelectorAll("[data-center]").forEach(b=>{b.classList.toggle("active",b.dataset.center===state.spotifyMode);b.onclick=()=>{savePatch({spotifyMode:b.dataset.center});openSheet("center");}});
    const v=$("s-vinyl");v.oninput=()=>{$("v-vinyl").textContent=v.value+"%";debouncePatch({vinylSize:Number(v.value)})};on("s-spotify",e=>savePatch({showSpotify:e.target.checked}));
  }
  if(kind==="footer"){on("s-footer",e=>savePatch({showFooter:e.target.checked}));on("s-temp",e=>savePatch({showTemp:e.target.checked}));on("s-mini",e=>savePatch({showClock:e.target.checked}));on("s-forecast",e=>savePatch({showForecast:e.target.checked}));}
  if(kind==="glass")[["s-opacity","v-opacity","glassOpacity","%"],["s-blur","v-blur","glassBlur","px"],["s-radius","v-radius","cardRadius","px"]].forEach(([i,v,k,u])=>{const r=$(i);r.oninput=()=>{$(v).textContent=r.value+u;debouncePatch({[k]:Number(r.value)})}});
  if(kind==="sizes")[["s-text","v-text","textScale"],["s-icon","v-icon","iconScale"],["s-spotify-scale","v-spotify-scale","spotifyScale"]].forEach(([i,v,k])=>{const r=$(i);r.oninput=()=>{$(v).textContent=r.value+"%";debouncePatch({[k]:Number(r.value)})}});
  if(kind==="photos"){const r=$("s-photo");r.oninput=()=>{$("v-photo").textContent=r.value+"s";debouncePatch({photoInterval:Number(r.value)})};}
}

document.querySelectorAll("[data-sheet]").forEach(e=>e.onclick=()=>openSheet(e.dataset.sheet));
$("sheet-close").onclick=()=>$("sheet").classList.remove("open");$("sheet").onclick=e=>{if(e.target===$("sheet"))$("sheet").classList.remove("open")};
window.addEventListener("keydown",e=>{if(e.key==="Escape")$("sheet").classList.remove("open")});
</script>
</body>
</html>
